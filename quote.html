<section class="page-banner">

<div class="container">

<h2>Request a Quote</h2>

<p>
Tell us your requirements and our team will contact you as soon as possible.
</p>

</div>

</section>

<section class="quote-form">

<div class="container">



<form action="https://formsubmit.co/nexus.tradeworks@gmail.com" method="POST">
<input type="hidden" name="_next" value="https://nexora-global-trading.github.io/Nexora-Global-Trading/quote.html">

<input type="hidden" name="_subject" value="New Quote Request - Nexora Global Trading">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="thankyou.html">

<label>Full Name *</label>
<input type="text" name="full_name" placeholder="Enter your full name" required>

<label>Company Name</label>
<input type="text" name="company_name" placeholder="Your company name">

<label>Country *</label>
<input type="text" name="country" placeholder="Your country" required>

<label>Email Address *</label>
<input type="email" name="email" placeholder="you@example.com" required>

<label for="country-code">Phone / WhatsApp *</label>

<div class="phone-group">

<select id="country-code" name="country_code" required>

<option value="+92" selected>🇵🇰 +92 (Pakistan)</option>
<option value="+1">🇺🇸 +1 (USA)</option>
<option value="+44">🇬🇧 +44 (UK)</option>
<option value="+971">🇦🇪 +971 (UAE)</option>
<option value="+966">🇸🇦 +966 (Saudi Arabia)</option>
<option value="+61">🇦🇺 +61 (Australia)</option>
<option value="+81">🇯🇵 +81 (Japan)</option>
<option value="+86">🇨🇳 +86 (China)</option>
<option value="+91">🇮🇳 +91 (India)</option>
<option value="+880">🇧🇩 +880 (Bangladesh)</option>

</select>

<input
type="tel"
name="phone"
placeholder="3012345678"
required>

</div>

<label>Product Required</label>

<select name="product" required>
<option>T-Shirts</option>
<option>Polo Shirts</option>
<option>Tracksuits</option>
<option>Sports Jerseys</option>
<option>Goalkeeper Gloves</option>
<option>Professional Footballs</option>
<option>Football Shoes</option>
<option>Other</option>
</select>

<label>Estimated Quantity</label>

<input
type="text"
name="quantity"
placeholder="Example: 500 Pieces">

<label>Your Requirements</label>

<textarea
name="requirements"
rows="6"
placeholder="Describe your requirements..."></textarea>

<button type="submit" class="btn">
Request Quote
</button>

</form>

</div>
</section>
